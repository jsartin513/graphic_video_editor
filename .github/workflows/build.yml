name: Build Video Editor

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-x64-fat:
    needs: test
    if: github.ref_type != 'tag'
    runs-on: macos-14  # Apple Silicon runner (can build x64 via Rosetta 2)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'x64'
        run: npm run prebuild:x64

      - name: Verify binaries exist
        run: |
          if [ ! -f resources/ffmpeg ] || [ ! -f resources/ffprobe ]; then
            echo "❌ Error: FFmpeg binaries not found in resources/ directory"
            ls -la resources/ || echo "resources/ directory does not exist"
            exit 1
          fi
          echo "✅ FFmpeg binaries found:"
          ls -lh resources/ffmpeg resources/ffprobe
          file resources/ffmpeg resources/ffprobe
          FFMPEG_ARCH=$(file resources/ffmpeg | grep -o 'arm64\|x86_64' | head -1)
          FFPROBE_ARCH=$(file resources/ffprobe | grep -o 'arm64\|x86_64' | head -1)
          if [ "$FFMPEG_ARCH" != "$FFPROBE_ARCH" ]; then
            echo "❌ Architecture mismatch: ffmpeg=$FFMPEG_ARCH ffprobe=$FFPROBE_ARCH"
            exit 1
          fi
          echo "✅ Architecture match: $FFMPEG_ARCH"

      - name: Build for x64 (Intel) - Fat Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'x64'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:fat:x64

      - name: Rename x64 files to include architecture suffix
        run: |
          cd dist
          for file in *.dmg *.zip; do
            if [[ -f "$file" && "$file" != *"arm64"* && "$file" != *"x64"* && "$file" != *"fat"* && "$file" != *"lite"* ]]; then
              ext="${file##*.}"
              basename="${file%.*}"
              newname="${basename}-x64-fat.${ext}"
              mv "$file" "$newname" || true
              echo "Renamed $file to $newname"
            fi
          done
          ls -la

      - name: Upload x64 fat artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Video-Merger-x64-fat
          path: |
            dist/*x64*fat*.dmg
            dist/*x64*fat*.zip
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  build-x64-lite:
    needs: test
    if: github.ref_type != 'tag'
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for x64 (Intel) - Lite Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'false'
          TARGET_ARCH: 'x64'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:x64

      - name: Rename x64 files to include architecture suffix
        run: |
          cd dist
          for file in *.dmg *.zip; do
            if [[ -f "$file" && "$file" != *"arm64"* && "$file" != *"x64"* && "$file" != *"fat"* && "$file" != *"lite"* ]]; then
              newname="${file%.*}-x64-lite.${file##*.}"
              mv "$file" "$newname" || true
              echo "Renamed $file to $newname"
            fi
          done
          ls -la

      - name: Upload x64 lite artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Video-Merger-x64-lite
          path: |
            dist/*x64*lite*.dmg
            dist/*x64*lite*.zip
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  build-arm64-fat:
    needs: test
    if: github.ref_type != 'tag'
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'arm64'
        run: npm run prebuild:arm64

      - name: Verify binaries exist
        run: |
          if [ ! -f resources/ffmpeg ] || [ ! -f resources/ffprobe ]; then
            echo "❌ Error: FFmpeg binaries not found in resources/ directory"
            ls -la resources/ || echo "resources/ directory does not exist"
            exit 1
          fi
          echo "✅ FFmpeg binaries found:"
          ls -lh resources/ffmpeg resources/ffprobe
          file resources/ffmpeg resources/ffprobe
          FFMPEG_ARCH=$(file resources/ffmpeg | grep -o 'arm64\|x86_64' | head -1)
          FFPROBE_ARCH=$(file resources/ffprobe | grep -o 'arm64\|x86_64' | head -1)
          if [ "$FFMPEG_ARCH" != "$FFPROBE_ARCH" ]; then
            echo "❌ Architecture mismatch: ffmpeg=$FFMPEG_ARCH ffprobe=$FFPROBE_ARCH"
            exit 1
          fi
          echo "✅ Architecture match: $FFMPEG_ARCH"

      - name: Build for arm64 (Apple Silicon) - Fat Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'arm64'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:fat:arm64

      - name: Rename arm64 files to include variant suffix
        run: |
          cd dist
          for file in *arm64.dmg *arm64.zip; do
            if [[ -f "$file" && "$file" != *"fat"* && "$file" != *"lite"* ]]; then
              ext="${file##*.}"
              basename="${file%.*}"
              newname="${basename}-fat.${ext}"
              mv "$file" "$newname" || true
              echo "Renamed $file to $newname"
            fi
          done
          ls -la

      - name: Upload arm64 fat artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Video-Merger-arm64-fat
          path: |
            dist/*arm64*fat*.dmg
            dist/*arm64*fat*.zip
            dist/latest-mac.yml
          retention-days: 30

  build-arm64-lite:
    needs: test
    if: github.ref_type != 'tag'
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for arm64 (Apple Silicon) - Lite Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'false'
          TARGET_ARCH: 'arm64'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:arm64

      - name: Rename arm64 files to include variant suffix
        run: |
          cd dist
          for file in *arm64*.dmg *arm64*.zip; do
            if [[ -f "$file" && "$file" != *"fat"* && "$file" != *"lite"* ]]; then
              basename="${file%.*}"
              ext="${file##*.}"
              newname="${basename}-lite.${ext}"
              mv "$file" "$newname" || true
              echo "Renamed $file to $newname"
            fi
          done
          ls -la

      - name: Upload arm64 lite artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Video-Merger-arm64-lite
          path: |
            dist/*arm64*lite*.dmg
            dist/*arm64*lite*.zip
            dist/latest-mac.yml
          retention-days: 30
          if-no-files-found: error

  build-signed-arm64-fat:
    needs: test
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Download FFmpeg binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'arm64'
        run: npm run prebuild:arm64

      - name: Build signed notarized arm64 fat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'arm64'
          PUBLISH_TO_GITHUB: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          npx electron-builder --config electron-builder.config.js --mac --arm64 --publish never
          cp dist/latest-mac.yml dist/latest-mac-arm64.yml

      - name: Verify bundled ffmpeg signatures
        run: |
          APP="dist/mac-arm64/Video Merger.app"
          for helper in "$APP/Contents/Resources/resources/ffmpeg" "$APP/Contents/Resources/resources/ffprobe"; do
            codesign --verify --strict "$helper"
            codesign -dv "$helper" 2>&1 | grep -q "Developer ID Application"
          done

      - name: Upload signed arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-arm64-fat
          path: |
            dist/*arm64*fat*.dmg
            dist/*arm64*fat*.zip
            dist/latest-mac-arm64.yml
          if-no-files-found: error
          retention-days: 14

  build-signed-x64-fat:
    needs: test
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Download FFmpeg binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'x64'
        run: npm run prebuild:x64

      - name: Build signed notarized x64 fat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'x64'
          PUBLISH_TO_GITHUB: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          npx electron-builder --config electron-builder.config.js --mac --x64 --publish never
          cp dist/latest-mac.yml dist/latest-mac-x64.yml

      - name: Verify bundled ffmpeg signatures
        run: |
          APP="dist/mac/Video Merger.app"
          for helper in "$APP/Contents/Resources/resources/ffmpeg" "$APP/Contents/Resources/resources/ffprobe"; do
            codesign --verify --strict "$helper"
            codesign -dv "$helper" 2>&1 | grep -q "Developer ID Application"
          done

      - name: Upload signed x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-x64-fat
          path: |
            dist/*x64*fat*.dmg
            dist/*x64*fat*.zip
            dist/latest-mac-x64.yml
          if-no-files-found: error
          retention-days: 14

  publish-signed-release:
    needs: [build-signed-arm64-fat, build-signed-x64-fat]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: signed-arm64-fat
          path: release/arm64

      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: signed-x64-fat
          path: release/x64

      - name: Merge latest-mac.yml for electron-updater
        run: |
          node scripts/merge-latest-mac-yml.js \
            release/arm64/latest-mac-arm64.yml \
            release/x64/latest-mac-x64.yml \
            release/latest-mac.yml
          ls -la release/arm64 release/x64 release/latest-mac.yml

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release/arm64/*.dmg
            release/arm64/*.zip
            release/x64/*.dmg
            release/x64/*.zip
            release/latest-mac.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

