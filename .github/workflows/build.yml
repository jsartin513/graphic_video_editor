name: Build Video Editor

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.cursor/**'
      - 'LICENSE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.cursor/**'
      - 'LICENSE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
  workflow_dispatch:
    inputs:
      mac_packaging:
        description: Build macOS DMG/ZIP artifacts (unsigned)
        type: boolean
        default: true

env:
  NODE_VERSION: '18'

jobs:
  packaging-gate:
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.decide.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        id: packaging_paths
        if: github.event_name == 'pull_request'
        with:
          filters: |
            packaging:
              - 'build/**'
              - 'electron-builder.config.js'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
      - id: decide
        run: |
          mac=false
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            mac=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mac_packaging }}" != "false" ]]; then
            mac=true
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ steps.packaging_paths.outputs.packaging }}" == "true" ]]; then
            mac=true
          fi
          echo "mac=${mac}" >> "$GITHUB_OUTPUT"
          echo "macOS packaging: ${mac}"

  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install E2E system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          npx playwright install-deps

      - name: Run Playwright E2E (Electron on Linux)
        run: xvfb-run -a npm run test:e2e

  build-x64-fat:
    needs: [test, e2e, packaging-gate]
    if: >-
      needs.packaging-gate.outputs.mac == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-mac-

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'x64'
        run: npm run prebuild:x64

      - name: Verify binaries exist
        run: |
          if [ ! -f resources/ffmpeg ] || [ ! -f resources/ffprobe ]; then
            echo "❌ Error: FFmpeg binaries not found in resources/ directory"
            ls -la resources/ || echo "resources/ directory does not exist"
            exit 1
          fi
          echo "✅ FFmpeg binaries found:"
          ls -lh resources/ffmpeg resources/ffprobe
          file resources/ffmpeg resources/ffprobe
          FFMPEG_ARCH=$(file resources/ffmpeg | grep -o 'arm64\|x86_64' | head -1)
          FFPROBE_ARCH=$(file resources/ffprobe | grep -o 'arm64\|x86_64' | head -1)
          if [ "$FFMPEG_ARCH" != "$FFPROBE_ARCH" ]; then
            echo "❌ Architecture mismatch: ffmpeg=$FFMPEG_ARCH ffprobe=$FFPROBE_ARCH"
            exit 1
          fi
          echo "✅ Architecture match: $FFMPEG_ARCH"

      - name: Build for x64 (Intel) - Fat Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'x64'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:fat:x64

      - name: Rename x64 files to include architecture suffix
        run: |
          cd dist
          for file in *.dmg *.zip; do
            if [[ -f "$file" && "$file" != *"arm64"* && "$file" != *"x64"* && "$file" != *"fat"* && "$file" != *"lite"* ]]; then
              ext="${file##*.}"
              basename="${file%.*}"
              newname="${basename}-x64-fat.${ext}"
              mv "$file" "$newname" || true
              echo "Renamed $file to $newname"
            fi
          done
          ls -la

      - name: Upload x64 fat artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Video-Merger-x64-fat
          path: |
            dist/*x64*fat*.dmg
            dist/*x64*fat*.zip
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  build-x64-lite:
    needs: [test, e2e, packaging-gate]
    if: >-
      needs.packaging-gate.outputs.mac == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-mac-

      - name: Install dependencies
        run: npm ci

      - name: Build for x64 (Intel) - Lite Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'false'
          TARGET_ARCH: 'x64'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:x64

      - name: Rename x64 files to include architecture suffix
        run: |
          cd dist
          for file in *.dmg *.zip; do
            if [[ -f "$file" && "$file" != *"arm64"* && "$file" != *"x64"* && "$file" != *"fat"* && "$file" != *"lite"* ]]; then
              newname="${file%.*}-x64-lite.${file##*.}"
              mv "$file" "$newname" || true
              echo "Renamed $file to $newname"
            fi
          done
          ls -la

      - name: Upload x64 lite artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Video-Merger-x64-lite
          path: |
            dist/*x64*lite*.dmg
            dist/*x64*lite*.zip
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  build-arm64-fat:
    needs: [test, e2e, packaging-gate]
    if: >-
      needs.packaging-gate.outputs.mac == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-mac-

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'arm64'
        run: npm run prebuild:arm64

      - name: Verify binaries exist
        run: |
          if [ ! -f resources/ffmpeg ] || [ ! -f resources/ffprobe ]; then
            echo "❌ Error: FFmpeg binaries not found in resources/ directory"
            ls -la resources/ || echo "resources/ directory does not exist"
            exit 1
          fi
          echo "✅ FFmpeg binaries found:"
          ls -lh resources/ffmpeg resources/ffprobe
          file resources/ffmpeg resources/ffprobe
          FFMPEG_ARCH=$(file resources/ffmpeg | grep -o 'arm64\|x86_64' | head -1)
          FFPROBE_ARCH=$(file resources/ffprobe | grep -o 'arm64\|x86_64' | head -1)
          if [ "$FFMPEG_ARCH" != "$FFPROBE_ARCH" ]; then
            echo "❌ Architecture mismatch: ffmpeg=$FFMPEG_ARCH ffprobe=$FFPROBE_ARCH"
            exit 1
          fi
          echo "✅ Architecture match: $FFMPEG_ARCH"

      - name: Build for arm64 (Apple Silicon) - Fat Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'true'
          TARGET_ARCH: 'arm64'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:fat:arm64

      - name: Rename arm64 files to include variant suffix
        run: |
          cd dist
          for file in *arm64.dmg *arm64.zip; do
            if [[ -f "$file" && "$file" != *"fat"* && "$file" != *"lite"* ]]; then
              ext="${file##*.}"
              basename="${file%.*}"
              newname="${basename}-fat.${ext}"
              mv "$file" "$newname" || true
              echo "Renamed $file to $newname"
            fi
          done
          ls -la

      - name: Upload arm64 fat artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Video-Merger-arm64-fat
          path: |
            dist/*arm64*fat*.dmg
            dist/*arm64*fat*.zip
            dist/latest-mac.yml
          retention-days: 30

  build-arm64-lite:
    needs: [test, e2e, packaging-gate]
    if: >-
      needs.packaging-gate.outputs.mac == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-mac-

      - name: Install dependencies
        run: npm ci

      - name: Build for arm64 (Apple Silicon) - Lite Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_FFMPEG: 'false'
          TARGET_ARCH: 'arm64'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:arm64

      - name: Rename arm64 files to include variant suffix
        run: |
          cd dist
          for file in *arm64*.dmg *arm64*.zip; do
            if [[ -f "$file" && "$file" != *"fat"* && "$file" != *"lite"* ]]; then
              basename="${file%.*}"
              ext="${file##*.}"
              newname="${basename}-lite.${ext}"
              mv "$file" "$newname" || true
              echo "Renamed $file to $newname"
            fi
          done
          ls -la

      - name: Upload arm64 lite artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Video-Merger-arm64-lite
          path: |
            dist/*arm64*lite*.dmg
            dist/*arm64*lite*.zip
            dist/latest-mac.yml
          retention-days: 30
          if-no-files-found: error

  build-win-fat:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Windows icon
        run: npm run generate-win-icon

      - name: Download FFmpeg binaries
        env:
          BUNDLE_FFMPEG: 'true'
        run: npm run prebuild:win

      - name: Verify binaries exist
        shell: pwsh
        run: |
          if (-not (Test-Path resources/ffmpeg.exe) -or -not (Test-Path resources/ffprobe.exe)) {
            Write-Error "FFmpeg binaries not found in resources/"
            exit 1
          }
          Get-Item resources/ffmpeg.exe, resources/ffprobe.exe | Format-Table Name, Length

      - name: Build for Windows x64 - Fat Build
        env:
          BUNDLE_FFMPEG: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win:x64

      - name: Upload Windows fat artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Video-Merger-win-x64-fat
          path: |
            dist/*x64*fat*.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  # Signed friend releases are created locally via `npm run release` (see RELEASE.md).
  # Re-enable when CI has Apple signing secrets (FUTURE_RELEASE.md).
  release:
    needs: [build-x64-fat, build-x64-lite, build-arm64-fat, build-arm64-lite]
    runs-on: ubuntu-latest
    if: false
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download x64 fat artifacts
        uses: actions/download-artifact@v4
        with:
          name: Video-Merger-x64-fat
          path: artifacts/x64-fat

      - name: Download x64 lite artifacts
        uses: actions/download-artifact@v4
        with:
          name: Video-Merger-x64-lite
          path: artifacts/x64-lite

      - name: Download arm64 fat artifacts
        uses: actions/download-artifact@v4
        with:
          name: Video-Merger-arm64-fat
          path: artifacts/arm64-fat

      - name: Download arm64 lite artifacts
        uses: actions/download-artifact@v4
        with:
          name: Video-Merger-arm64-lite
          path: artifacts/arm64-lite

      - name: List downloaded artifacts
        run: |
          echo "=== Artifacts structure ==="
          find artifacts -type f -name "*" || echo "No artifacts found"
          echo ""
          echo "=== x64-fat ==="
          ls -la artifacts/x64-fat/ || echo "x64-fat directory not found"
          echo ""
          echo "=== x64-lite ==="
          ls -la artifacts/x64-lite/ || echo "x64-lite directory not found"
          echo ""
          echo "=== arm64-fat ==="
          ls -la artifacts/arm64-fat/ || echo "arm64-fat directory not found"
          echo ""
          echo "=== arm64-lite ==="
          ls -la artifacts/arm64-lite/ || echo "arm64-lite directory not found"

      - name: Determine release tag and name
        id: release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="Release ${{ github.ref_name }}"
            IS_PRERELEASE="false"
          else
            TAG_NAME="v${{ github.run_number }}-${{ github.sha }}"
            RELEASE_NAME="Build from main (${{ github.sha }} - Run #${{ github.run_number }})"
            IS_PRERELEASE="true"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Tag: ${TAG_NAME}"
          echo "Release name: ${RELEASE_NAME}"
          echo "Prerelease: ${IS_PRERELEASE}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ${{ steps.release.outputs.release_name }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/latest-mac.yml
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
